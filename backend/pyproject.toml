[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stova-api"
version = "1.0.0"
description = "Stova publishing API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "SQLAlchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "httpx>=0.28,<1", "PyJWT>=2.10,<3",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "anyio>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "asgi-lifespan>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
